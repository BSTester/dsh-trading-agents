name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install.sh 语法检查
        run: bash -n install.sh

      - name: preset YAML 结构检查
        run: |
          node - <<'EOF'
          const fs = require('fs');
          // 轻量结构检查：真实方言（!!js 标签）由运行时挂载校验兜底
          const src = fs.readFileSync('agent.cordis.yml', 'utf8');
          if (!/- id: persona/.test(src)) throw new Error('missing persona row');
          if (!/- id: futu-mcp/.test(src)) throw new Error('missing futu-mcp row');
          if (!/serverName: futu/.test(src)) throw new Error('futu-mcp: bad serverName');
          if (!/url: https:\/\/mcp\.futunn\.com\/mcp/.test(src)) throw new Error('futu-mcp: bad url');
          for (const f of ['preset.yml', 'skills/trading-agents/SKILL.md']) {
            if (!fs.existsSync(f)) throw new Error(`missing ${f}`);
          }
          const skill = fs.readFileSync('skills/trading-agents/SKILL.md', 'utf8');
          if (!skill.startsWith('---\nname: trading-agents')) throw new Error('bad skill frontmatter');
          console.log('structure OK');
          EOF

      - name: 插件包可加载性
        run: node --input-type=module -e "import('./plugins/trading-agents/src/index.js').then(m => { if (typeof m.default !== 'function') throw new Error('bad default export'); console.log('plugin module OK') })"
