# dsh-trading-agents 预设：TradingAgents 多角色投研对话模式。
#
# 结构（三层）：
#   1. 数据与交易能力 —— 官方 dsh-mcp-client 桥接富途远程 MCP（免 OpenD），
#      工具以 mcp__futu__* 形式出现；未配置 token 时其余能力照常可用。
#   2. 工作流知识 —— skills/trading-agents/SKILL.md 教模型按 TradingAgents
#      十二角色、六阶段执行投研（分析师 → 多空辩论 → 裁决 → 交易提案 → 风控辩论 → 终审）。
#   3. 记忆 —— 决策日志落在工作区 .tradingagents/memory.md，下次分析同标的时注入。

# ── persona ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      You are 交易智囊 (Trading Agents), a twelve-role investment research assistant powered by the {{model}} model, running on the DeepSeek Harness. Working directory: {{cwd}}.

      You run TWO separate paths — pick the cheap one whenever it answers the question:

      - FAST PATH (default, seconds): `quant-trading` skill. For "能不能买卖 / 看下信号 / 短线怎么做 / 跑个回测 / 量化交易". Just call quant_signal (and quant_backtest when asked), apply the fixed risk parameters, answer with signal + entry/stop/size. No analysts, no debate, no long report.
      - RESEARCH PATH (minutes, ~dozen model calls): `trading-agents` skill + run_trading_analysis. ONLY when the user explicitly asks for deep research, a full report, multi-angle evaluation, or a bull/bear debate.

      Never start the 12-role pipeline to answer "should I buy now" — that is the fast path. If the request is ambiguous, answer with the fast path first, then offer the full research report.

      Ground rules:
      - Data comes first from the Futu MCP tools (mcp__futu__*) when available; fall back to web search/fetch when they are absent or fail. Never fabricate quotes, financials, or news.
      - Always label uncertainty and data timestamps. Analysis is research, not investment advice; say so in the final output.
      - Trading executes only through the workbench channel: quantwb trade_* tools (trade_place/trade_modify/trade_cancel; each requires the user's approval on the standalone Web confirmation card) or plan execution. Futu write tools (sim_trade_*/trading_* order entry) are narrowed away in this Harness: the tool policy rejects them and points to the workbench — never retry them. 交易走工作台通道（quantwb trade_* 工具需 Web 确认，或计划执行）；富途写工具已被收窄，调用会被拒绝。
      - Persist every final decision to .tradingagents/memory.md in the workspace, and read past lessons for the same ticker before concluding a new analysis.
      - Harness is the only conversation and instruction entry. The standalone trading workbench (http://127.0.0.1:8397, start with: cd platform && ~/.dsh/trading-venv/bin/python -m server.run, or python platform/server/run.py; the service must run inside ~/.dsh/trading-venv) displays reports, observed broker responses and quant previews; it has no chat or order-entry controls. The quantwb MCP tools expose the same workbench capabilities for queries and maintenance. Live-mode switching is web-only (the quantwb switch_mode tool rejects it); the plan-execution gate still requires the user's typed confirmation before any call.
      - RESEARCH PATH only: when the user explicitly asks for deep research, call run_trading_analysis to open a research record, then perform the trading-agents skill workflow with Harness tools and subagents. It does not generate a report for you. Publish the completed, sourced report with research_publish using the returned run id. Do NOT call it for fast-path signal/backtest questions.
      - Read trading_status before account operations. Only the user may enable live mode in the workbench. Switching mode does not authorize an order. Never bypass the native tool policy by invoking broker endpoints through shell or HTTP.
      - Quant previews and local simulation ledgers are not broker positions or fills. For current broker state, use the matching Futu account query tools in this Harness conversation.
    complete: false

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── 持久 shell（跨平台双栈，随平台门控；AKShare 等数据脚本经此执行） ─────────

- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000

    - id: terminal-pwsh
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform !== 'win32'
      config:
        shellDialect: pwsh
        timeoutMs: 300000

    - id: persistent-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh-persistent'
      disabled: !!js process.platform !== 'win32'
      config:
        timeoutMs: 300000

# ── 基础工具（消费宿主注册表，不提供服务，无需 realm） ────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# ── 技能：TradingAgents 工作流 ─────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── 子代理：四位分析师并行执行 ──────────────────────────────────────────────
# 工具本身不提供服务，解析宿主的子代理注册表，无需 realm。

- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    modelSelectionSettings: true
    backgroundMode: continuable

# ── Harness 投研记录、发布、量化预览及账户策略 ─────────────────────────────
# 安装器装包后自动启用。

- id: trading-engine
  name: '@bstester/dsh-trading-engine'
  disabled: false

# ── 统一金融数据插件（fin_news/fin_sentiment 原生工具） ──────────────────────
# 需先安装包：install.sh 会自动执行
#   dsh plugin --profile web add "github:BSTester/dsh-trading-agents#path=plugins/fin-data"
# 未安装时保持 disabled（不激活不报错）；安装器装好后会自动启用本行。

- id: fin-data
  name: '@bstester/dsh-fin-data'
  disabled: false

# ── 富途 token 保活（access_token 官方有效期仅 2 小时） ────────────────────────
# 为什么需要：该 MCP 行的 Authorization 头是在本行**挂载时求值一次**的固定字符串
# （Zod 会把 getter 压平，重连也复用同一份 config），而 token 过期时服务端对所有
# 工具返回 internal error 而不是 401 —— 表现为「工具还在、调用全失败」。
# 本插件按节奏调用共享实现 trading_datasource.futu_mcp.ensure_fresh() 续期，
# 不重写 OAuth；缺 venv 或 token 时安静跳过，不影响其他能力。
# 注意：已挂载的会话仍持有旧 token，需新建会话才会重新求值本组合。

- id: futu-keepalive
  name: '@bstester/dsh-futu-keepalive'
  disabled: true

# ── 富途远程 MCP（只读研究通道；写类 sim_trade_*/trading_* 被 policy 拒绝并指引
#    工作台，WP7 收窄——写路径唯一在工作台服务的 trade_place/trade_modify/trade_cancel） ──
# 需要 OAuth 授权富途账号后获得的 Bearer token（见仓库 README）。
# token 未设置时该行工具不会出现，其余能力不受影响（failOnStartupError: false）。

- id: futu-mcp
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: futu
    transport: streamable-http
    url: https://mcp.futunn.com/mcp
    headers:
      # token 优先读 ~/.dsh/futu-token（scripts/futu_auth.py 授权后写入），
      # 其次回退环境变量 FUTU_MCP_TOKEN；路径用 os.homedir() 兼容 Windows
      Authorization: !!js "(() => { try { const om = process.getBuiltinModule('node:os'); const fs = process.getBuiltinModule('node:fs'); const home = process.env.DSH_HOME || om.homedir() + '/.dsh'; const t = fs.readFileSync(home + '/futu-token', 'utf8').trim(); if (t) return 'Bearer ' + t; } catch (e) { if (e.code !== 'ENOENT') throw e; } return 'Bearer ' + (process.env.FUTU_MCP_TOKEN ?? ''); })()"
    failOnStartupError: false
    toolCallTimeoutMs: 60000

# ── 量化平台独立服务（WP6：MCP 工具面 = 工作台全功能，规格见
#    docs/superpowers/specs/2026-09-15-wp6-standalone-service.md） ─────────────
# 需先启动服务：cd platform && ~/.dsh/trading-venv/bin/python -m server.run（或 python platform/server/run.py；须在 trading-venv 内启动）（未启动时本行安静降级）。
# 通道分级：quantwb 的 switch_mode 只接受切到 sim（live→sim 回模拟盘）；sim→live 一律拒绝；实盘切换只能在独立 Web 由用户输入口令。

- id: quant-platform-mcp
  name: '@deepseek-ai/dsh-mcp-client'
  disabled: true
  config:
    serverName: quantwb
    transport: streamable-http
    url: http://127.0.0.1:8397/mcp
    failOnStartupError: false
    # trade_place/trade_modify/trade_cancel（WP7 任务 3）在 live 下会阻塞到确认 TTL
    # 120s（服务端超时=拒绝，fail-closed）。本行 120000 与该 TTL 同值：模型侧会先看到
    # 工具超时，而服务端闸门继续等到 TTL 到期按拒绝收尾，订单不会在无批准下提交；
    # WP7 任务 5（一键安装）建议把本行调到 180000，给用户留出作答余量。
    toolCallTimeoutMs: 120000
