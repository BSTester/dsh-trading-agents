# dsh-trading-agents 预设：TradingAgents 多角色投研对话模式。
#
# 结构（三层）：
#   1. 数据与交易能力 —— 官方 dsh-mcp-client 桥接富途远程 MCP（免 OpenD），
#      工具以 mcp__futu__* 形式出现；未配置 token 时其余能力照常可用。
#   2. 工作流知识 —— skills/trading-agents/SKILL.md 教模型按 TradingAgents
#      六角色流水线执行投研（分析师 → 多空辩论 → 裁决 → 交易提案 → 风控辩论 → 终审）。
#   3. 记忆 —— 决策日志落在工作区 .tradingagents/memory.md，下次分析同标的时注入。

# ── persona ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are 交易智囊 (Trading Agents), a twelve-role investment research assistant powered by the {{model}} model, running on the DeepSeek Harness. Working directory: {{cwd}}.

      You operate a TradingAgents-style pipeline: analysts → bull/bear debate → research manager → trader → risk debate → portfolio manager. The `trading-agents` skill defines the full workflow; load it with the skill tool before running any analysis.

      Ground rules:
      - Data comes first from the Futu MCP tools (mcp__futu__*) when available; fall back to web search/fetch when they are absent or fail. Never fabricate quotes, financials, or news.
      - Always label uncertainty and data timestamps. Analysis is research, not investment advice; say so in the final output.
      - Trading actions default to simulation. A real (live) order requires the user's explicit confirmation of the full order summary, twice, before any call. Never place a live order without that confirmation.
      - Persist every final decision to .tradingagents/memory.md in the workspace, and read past lessons for the same ticker before concluding a new analysis.
    complete: false

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── 持久 shell（跨平台双栈，随平台门控；AKShare 等数据脚本经此执行） ─────────

- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000

    - id: terminal-pwsh
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform !== 'win32'
      config:
        shellDialect: pwsh
        timeoutMs: 300000

    - id: persistent-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh-persistent'
      disabled: !!js process.platform !== 'win32'
      config:
        timeoutMs: 300000

# ── 基础工具（消费宿主注册表，不提供服务，无需 realm） ────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# ── 技能：TradingAgents 工作流 ─────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── 子代理：四位分析师并行执行 ──────────────────────────────────────────────
# 工具本身不提供服务，解析宿主的子代理注册表，无需 realm。

- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    modelSelectionSettings: true
    backgroundMode: continuable

# ── 投研确定性引擎（run_trading_analysis 工具，v2） ──────────────────────────
# 安装器装包后自动启用。

- id: trading-engine
  name: '@bstester/dsh-trading-engine'
  disabled: true

# ── 统一金融数据插件（fin_news/fin_sentiment 原生工具） ──────────────────────
# 需先安装包：install.sh 会自动执行
#   dsh plugin --profile web add "github:BSTester/dsh-trading-agents#path=plugins/fin-data"
# 未安装时保持 disabled（不激活不报错）；安装器装好后会自动启用本行。

- id: fin-data
  name: '@bstester/dsh-fin-data'
  disabled: true

# ── 富途远程 MCP（数据与交易能力） ──────────────────────────────────────────
# 需要 OAuth 授权富途账号后获得的 Bearer token（见仓库 README）。
# token 未设置时该行工具不会出现，其余能力不受影响（failOnStartupError: false）。

- id: futu-mcp
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: futu
    transport: streamable-http
    url: https://mcp.futunn.com/mcp
    headers:
      # token 优先读 ~/.dsh/futu-token（scripts/futu_auth.py 授权后写入），
      # 其次回退环境变量 FUTU_MCP_TOKEN；路径用 os.homedir() 兼容 Windows
      Authorization: !!js "(() => { try { const om = process.getBuiltinModule('node:os'); const fs = process.getBuiltinModule('node:fs'); const t = fs.readFileSync(om.homedir() + '/.dsh/futu-token', 'utf8').trim(); if (t) return 'Bearer ' + t; } catch (e) {} return 'Bearer ' + (process.env.FUTU_MCP_TOKEN ?? ''); })()"
    failOnStartupError: false
    toolCallTimeoutMs: 60000
