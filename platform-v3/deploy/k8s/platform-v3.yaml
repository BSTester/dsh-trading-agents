# 量化交易决策平台 V3.0 —— Kubernetes 清单（规格 §5.1 服务拆分 / §8.1 部署架构）
#
# 设计取舍（如实说明）：本仓库当前实现是**单一代码库按角色拆分**，不是多语言微服务。
# 同一镜像通过 QUANT_V3_ROLE 挂载不同子系统，三个 Deployment 可独立扩缩容：
#   gateway   HTTP API + MCP 工具面（含 /metrics）
#   web       静态控制台 UI（9 页）+ 只读 API
#   scheduler 调度循环 + Headless Runner（只暴露 /healthz）
# 既有工作台（8397，持有富途 OpenAPI 与真实订单闸门）**不在集群内**：它是数据源与唯一执行
# 入口，集群内的 pod 通过 WORKBENCH_BASE 指向它。交易边界不因容器化而改变。
apiVersion: v1
kind: ConfigMap
metadata:
  name: quant-v3-config
  labels: { app: quant-v3 }
data:
  WORKBENCH_BASE: "http://quant-workbench.internal:8397" # 指向集群外的既有工作台
  QUANT_V3_DATA: "/app/data"
  QUANT_HEADLESS_CONCURRENCY: "3"
  QUANT_HEADLESS_TIMEOUT_MS: "300000"
  QUANT_HEADLESS_TOKEN_BUDGET: "200000"
  QUANT_SDK_ENABLED: "0" # 需要模型密钥时改为 1，并在 Secret 注入 DEEPSEEK_API_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: quant-v3-secrets
  labels: { app: quant-v3 }
type: Opaque
stringData:
  # 占位：真实部署用 kubectl create secret / 外部 KMS 注入，勿把明文提交进仓库
  DEEPSEEK_API_KEY: ""
  TUSHARE_TOKEN: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quant-v3-gateway
  labels: { app: quant-v3, role: gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: quant-v3, role: gateway }
  template:
    metadata:
      labels: { app: quant-v3, role: gateway }
    spec:
      containers:
        - name: gateway
          image: quant-platform-v3:3.0.0-alpha.1
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8407, name: http }]
          env:
            - { name: QUANT_V3_ROLE, value: gateway }
            - { name: QUANT_V3_HOST, value: "0.0.0.0" }
            - { name: QUANT_V3_PORT, value: "8407" }
          envFrom:
            - configMapRef: { name: quant-v3-config }
            - secretRef: { name: quant-v3-secrets, optional: true }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 384Mi }
          volumeMounts: [{ name: data, mountPath: /app/data }]
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: quant-v3-gateway
  labels: { app: quant-v3, role: gateway }
spec:
  selector: { app: quant-v3, role: gateway }
  ports: [{ name: http, port: 8407, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quant-v3-web
  labels: { app: quant-v3, role: web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: quant-v3, role: web }
  template:
    metadata:
      labels: { app: quant-v3, role: web }
    spec:
      containers:
        - name: web
          image: quant-platform-v3:3.0.0-alpha.1
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8407, name: http }]
          env:
            - { name: QUANT_V3_ROLE, value: web }
            - { name: QUANT_V3_HOST, value: "0.0.0.0" }
            - { name: QUANT_V3_PORT, value: "8407" }
          envFrom:
            - configMapRef: { name: quant-v3-config }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 200m, memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: quant-v3-web
  labels: { app: quant-v3, role: web }
spec:
  selector: { app: quant-v3, role: web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quant-v3-scheduler
  labels: { app: quant-v3, role: scheduler }
spec:
  replicas: 1 # 调度是单实例语义（同一天同一规则只触发一次），扩多副本需先做分布式锁
  selector:
    matchLabels: { app: quant-v3, role: scheduler }
  template:
    metadata:
      labels: { app: quant-v3, role: scheduler }
    spec:
      containers:
        - name: scheduler
          image: quant-platform-v3:3.0.0-alpha.1
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8407, name: health }]
          env:
            - { name: QUANT_V3_ROLE, value: scheduler }
            - { name: QUANT_V3_HOST, value: "0.0.0.0" }
            - { name: QUANT_V3_PORT, value: "8407" }
          envFrom:
            - configMapRef: { name: quant-v3-config }
            - secretRef: { name: quant-v3-secrets, optional: true }
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 1000m, memory: 512Mi } # Headless 子进程（dsh）在此容器内运行
          volumeMounts: [{ name: data, mountPath: /app/data }]
      volumes:
        - name: data
          emptyDir: {}
