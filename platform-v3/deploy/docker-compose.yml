# 单容器部署（默认形态）：一个容器跑全部角色，直连宿主机上的既有工作台（8397）。
#
# 挂载三件事，全部只读或独立卷，不复制不修改既有数据源：
#   1) ~/.dsh             → /dsh-home  既是配置来源（自选池/流水线/富途凭据元信息），
#                                      也是 dsh 运行时 home（凭据库/会话），供 Headless/SDK 通道使用
#   2) ~/.npm/_npx        → /npx:ro    复用宿主机已装 dsh（含预编译 node-pty）
#   3) 具名卷             → /app/data  平台自身数据（headless 日志、OMS 台账、策略轮、审计、SDK 回合）
services:
  quant-v3:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: quant-platform-v3:latest
    container_name: quant-v3
    network_mode: host
    environment:
      QUANT_V3_ROLE: all
      QUANT_V3_HOST: 127.0.0.1
      QUANT_V3_PORT: "8407"
      WORKBENCH_BASE: http://127.0.0.1:8397
      QUANT_V3_DATA: /app/data
      DSH_HOME: /dsh-home
      QUANT_CONFIG_HOME: /dsh-home
      DSH_BIN: /npx/node_modules/.bin/dsh
      QUANT_SDK_ENABLED: "1"
      QUANT_HEADLESS_CONCURRENCY: "3"
      QUANT_HEADLESS_TIMEOUT_MS: "300000"
    volumes:
      - ${DSH_HOME:-$HOME/.dsh}:/dsh-home
      - ${DSH_NPX_CACHE:-$HOME/.npm/_npx}:/npx:ro
      - quant-v3-data:/app/data
    restart: unless-stopped

volumes:
  quant-v3-data:
